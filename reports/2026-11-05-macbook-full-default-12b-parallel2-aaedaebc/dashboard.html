torial.v2", "schema_version": 2, "slug": "2026-11-05-macbook-full-default-12b-parallel2-aaedaebc", "title": "Why did adding a second memory slot on a MacBook make Med Agent Hub 3x faster to start answering?", "summary": "When a local AI server only keeps one conversation in active memory at a time, any background helper task evicts the patient chart and forces the AI to re-read thousands of words on the next question. On a 64 GB Apple Silicon MacBook running Gemma 4 12B, we configured two concurrent memory slots and compared Med Agent Hub against built-in ChartSearchAI across 17 HIV chart scenarios (35 questions per setup).", "takeaway": "Giving the local server two active memory slots raised Med Agent Hub's chart-memory reuse from 0% to 84%, cutting median wait for the first word by 3.3x (34.0s down to 10.3s) and full-answer time by 3.0x (35.9s down to 12.1s). At the same time, Med Agent Hub maintained its clinical quality and safety lead over built-in ChartSearchAI (79.8 vs. 75.9/100, with zero unsafe answers and zero invented facts vs. 1 of each on built-in).", "family": "chartsearchai", "featured": true, "arms": {"engine-parity-hub-answer-12b": "Med Agent Hub (Gemma 4 12B)", "engine-parity-bundled-12b": "Built-in ChartSearchAI (Gemma 4 12B)"}, "date": "2026-11-05"}</script><script type='application/json' id='dashboard-data' data-src='./dashboard-data.json'></script><script src='../assets/dashboard-shell.js?v=6dc9947828'></script></body></html>
