ai.editorial.v2", "schema_version": 2, "slug": "l5-full-default-2026-11-07-30e1b771", "title": "Can one shared 24 GB cloud GPU serve accurate HIV chart answers to four clinicians at the same time?", "summary": "In a busy clinic, several providers may query patient charts simultaneously on one modest GPU server. We compared Med Agent Hub's single-call answer path against built-in ChartSearchAI on a shared 24 GB cloud GPU running Google Gemma 4 12B (configured for up to four concurrent requests), evaluating both clinical answer quality across 17 HIV scenarios (35 questions per setup) and live response speed with 1, 2, and 4 simultaneous clinicians.", "takeaway": "Med Agent Hub beat built-in ChartSearchAI by +8.7 points on clinical quality (87.2 vs. 78.5/100, zero unsafe answers, zero wrong dates, 82/82 verified citations vs. 1 wrong date and 4 unnecessary refusals on built-in), led by major gains on upcoming appointments (100 vs. 77/100), 5-turn medication adherence dialogs (+14.8 points), and pediatric growth tracking. Under multi-user load, Med Agent Hub scaled throughput 3.5x from 1 to 4 concurrent clinicians (3.7 to 13.0 answers/min, keeping median follow-up first-word wait at 3.2s with zero errors), whereas built-in ChartSearchAI saturated at 9.2 answers/min with a 17.8s median wait for the first word.", "family": "chartsearchai", "featured": true, "arms": {"engine-parity-hub-answer-12b": "Med Agent Hub (Gemma 4 12B, 1-call answer)", "engine-parity-bundled-12b": "Built-in ChartSearchAI (Gemma 4 12B)"}, "date": "2026-11-07"}</script><script type='application/json' id='dashboard-data' data-src='./dashboard-data.json'></script><script src='../assets/dashboard-shell.js?v=6dc9947828'></script></body></html>
