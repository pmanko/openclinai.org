, "title": "Fast on-device models or a careful AI team — which is safer?", "summary": "Two patients, 8 clinical questions, five AI setups: Google's Gemma 12B and 4B single models, two brand-new on-device 'Liquid' (LFM2) single models (24B and 1.2B), and our multi-agent AI team. Every answer was graded against the full patient chart by an automated clinical rubric.", "takeaway": "The Gemma 12B single model was the most accurate and the safest — no unsafe answers, and it cited a chart record for every claim. The two new Liquid models were the fastest but the least safe: they often answered confidently without grounding their claims in the chart (almost never citing a record) and produced several unsafe answers — including a 'no allergies' reply for a patient whose chart documents a penicillin allergy. The AI team cited its sources and was far safer than the Liquid models, though it didn't beat the strong single model here. These are directional results from a single automated judge on a small sample, not a formal benchmark.", "family": "chartsearchai", "featured": true, "catalog_order": 31, "arms": {"12b-baseline": "Google Gemma 4 12B (single model)", "gemma-e4b-llamacpp": "Google Gemma 4 E4B (4B compact single)", "lfm2-1.2b-baseline": "Liquid LFM2 1.2B (tiny on-device single)", "lfm2-24b-baseline": "Liquid LFM2 24B (on-device single model)"}, "date": "18 Jun 2026"}</script><script type='application/json' id='dashboard-data' data-src='./dashboard-data.json'></script><script src='../assets/dashboard-shell.js?v=e146301b7258'></script></body></html>
