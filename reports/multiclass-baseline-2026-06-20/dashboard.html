gle AI model reads a clinical chart best?", "summary": "Three patients (two adults with HIV/TB and a pediatric infant), 32 clinical questions, seven setups: four single-model baselines across classes — Google Gemma 12B, Alibaba Qwen 14B, Google MedGemma 27B (a medical-specialist model), and the fast on-device Liquid LFM2 24B — plus a single model with an added elaboration and two multi-agent AI-team configurations. Every answer was graded against the full patient chart by an automated clinical rubric.", "takeaway": "A strong GENERAL single model wins: Gemma 12B (72) tied the full multi-agent team, and Qwen 14B (71) was just behind AND the safest single arm (1 unsafe answer vs Gemma's 3). The surprise: the medical-specialist MedGemma 27B scored BELOW the general models (65) with more unsafe answers (5) — domain fine-tuning did not help here — and the fast on-device Liquid 24B was the weakest and least safe (49, 8 unsafe). Directional results from a single automated judge on a small sample, not a formal benchmark.", "family": "chartsearchai", "featured": true, "arms": {"12b-baseline": "Google Gemma 4 12B (single model)", "qwen2.5-14b-baseline": "Alibaba Qwen 2.5 14B (single model)", "medgemma-27b-baseline": "Google MedGemma 27B (medical specialist)", "lfm2-24b-baseline": "Liquid LFM2 24B (on-device single model)", "Gemma 12B (single + in-depth)": "Google Gemma 4 12B (single + in-depth)", "AI team — Standard + checker": "Multi-agent AI team (Standard + checker)", "AI team — matched to baseline + in-depth": "Multi-agent AI team (matched + in-depth)"}, "date": "2026-06-20"}</script><script type='application/json' id='dashboard-data' data-src='./dashboard-data.json'></script><script src='../assets/dashboard-shell.js?v=32aef2b57b'></script></body></html>
