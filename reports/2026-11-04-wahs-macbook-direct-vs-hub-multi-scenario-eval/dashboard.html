 Duplicate Medications (Cholesterol and Blood Thinners)**\n*   **Cholesterol:** You have two different prescriptions for cholesterol. You are currently prescribed **Lipitor 40 MG** [12] and **Simvastatin 20 MG** [13]. The hospital discharge summary explicitly states to stop the Simvastatin immediately and reconcile these two orders [19].\n*   **Blood Thinners:** You have two different prescriptions for blood thinners. You are currently prescribed **Clopidogrel 75 MG** [14] and **Plavix 75 MG** [15]. The discharge summary notes that these are duplicates (Plavix is the brand name for Clopidogrel) and need to be reconciled following your coronary angioplasty [19].\n\n**2. Heart and Kidney Medications vs. Lab Results**\n*   **Potassium and Kidney Function:** Your recent labs from 2026-01-24 show a **Potassium level of 5.6 mmol/L** [22] and an **eGFR of 35 mL/min/1.73m2** [21], which indicates a decline to **CKD Stage 3B** [11].\n*   **Medication Holds:** Because of this high potassium and your declining kidney function, the hospital has instructed to **hold Lisinopril 10 MG** [16] and **Aldactone 25 MG** [17] immediately upon discharge [19].\n\n**3. Chronic Kidney Disease (CKD) Stages**\n*   There is a conflict in your recorded CKD stages. Your chart lists **Chronic kidney disease stage 2** [10] (onset 2022-05-14) and **Chronic kidney disease stage 3B** [11] (onset 2026-01-24). The most recent assessment confirms the progression to Stage 3B [11] [19].\n\nQUESTIONS_FOR_DOCTOR:\n- Can you confirm which single blood thinner (Clopidogrel or Plavix) I should continue taking now that the duplicates have been identified?\n- Since Lisinopril and Aldactone are on hold due to my potassium and kidney levels, what is the long-term plan for managing my blood pressure and heart failure?\n- Now that my CKD has progressed to Stage 3B, are there any other medications in my current list that need to be adjusted for my kidney function?", "answer_validation": {}, "answer_view": null, "inde d current records, here is the audit of your medications, lab results, and kidney disease staging:\n\n**1. Duplicate Medications (Cholesterol and Blood Thinners)**\nYour chart shows two sets of duplicate medications that need to be reconciled:\n*   **Cholesterol:** You have two different prescriptions for cholesterol. You are currently listed as active on **Lipitor 40 MG Oral Tablet** (atorvastatin) from the BIDMC Inpatient Cardiology team [12] and **Simvastatin 20 MG Oral Tablet** from Brookline Community Primary Care [13].\n*   **Blood Thinners:** You have two prescriptions for the same medication (clopidogrel). You are listed as active on **Clopidogrel 75 MG Oral Tablet** from the BIDMC Interventional Cardiology Clinic [14] and **Plavix 75 MG Oral Tablet** (which is the brand name for clopidogrel) from the BIDMC Inpatient Discharge Pharmacy [15].\n\n**2. Heart and Kidney Medications vs. Labs and Discharge Instructions**\nYour recent labs from 2026-01-24 show a **Potassium level of 5.6 mmol/L** [26] and an **eGFR of 35 mL/min/1.73m2** [25], which indicates a decline in kidney function (CKD Stage 3B) [11]. \n\nBecause of these high potassium levels and your kidney status, your discharge summary from 2026-01-26 explicitly instructs the medical team to **HOLD or STOP** the following medications immediately [19]:\n*   **Lisinopril 10 MG Oral Tablet** [16]\n*   **Aldactone 25 MG Oral Tablet** (spironolactone) [17]\n*   **Simvastatin 20 MG Oral Tablet** [13]\n\n*Note: While these are marked as \"active\" in your medication list, the hospital's clinical note [19] provides a direct order to stop them.*\n\n**3. Conflicting Kidney Disease (CKD) Stages**\nThere is a conflict in your active problem list regarding your kidney disease stage. Your chart currently lists both **Chronic kidney disease stage 2** [10] and **Chronic kidney disease stage 3B** [11] as active at the same time. According to clinical guidelines, you should only have one current stage assigned based on your most recent kidney function.\n\nQUESTIONS_FOR_DOCTOR:\n- Can you confirm that I should stop taking Lisinopril, Aldactone, and Simvastatin as instructed in my discharge summary [19]?\n- Can you reconcile my cholesterol medications so I am only taking one (Lipitor or Simvastatin) instead of both [12] [13]?\n- Can you update my records to show only my current CKD Stage 3B [11] and remove the older Stage 2 [10] designation?\n- Can you confirm which single blood thinner (Clopidogrel or Plavix) I should be taking to avoid a double dose [14] [15]?", "answer_validation": {}, "answer_view": null, "indepth_view": {"status": "not_in_profile", "label": "No In-Depth in this profile", "tone": "neutral", "symbol": "\u2013", "confidence": null, "confidence_level": null, "note": "", "findings": [], "checks": [], "marked": [], "claim_count": 0, "body_html": "", "claims": [], "draft": null, "check_names": {"date": "Date check", "review": "Model review", "citation": "Citation support"}, "validation": null}, "indepth_latency_ms": null, "review_sources": {}, "blocks": [], "sources": {"schema_version": "sources.v1", "sources": [{"source_id": "S1", "citation_index": 12, "record_index": 12, "chart_record_index": 12, "resource_type": "MedicationRequest", "resource_uuid": "mimic14354-med-lipitor", "date": "2026-01-25", "title": "Medication: Lipitor 40 MG Oral Tablet [atorvastatin] (status: active, type: prescribed, source: Beth Israel Deaconess Medical Center \u2014 Inpatient Cardiology, RxNorm: 617311)", "source_text": "(2026-01-25) Medication: Lipitor 40 MG Oral Tablet [atorvastatin] (status: active, type: prescribed, source: Beth Israel Deaconess Medical Center \u2014 Inpatient Cardiology, RxNorm: 617311)", "facts_used": [], "used_by": [{"kind": "answer_claim", "text": "on **Lipitor 40 MG Oral Tablet** (atorvastatin) from the BIDMC Inpatient Cardiology team [12] and **Simvastatin 20 MG Oral Tablet** from Brookline Community Primary Care [13]. * **B"}, {"kind": "answer_claim", "text": "cho y Dr. Carisa395 Kutch271) [25].\n*   **Lipitor 40 MG Oral Tablet (atorvastatin)** (prescribed on 2026-06-07 by MultiCare Pulse Heart Institute) [31].\n*   *Patient Meaning:* These are two different types of statins. Taking both simultaneously may be a duplicate therapy error.\n\n**2. Duplicate Antiplatelet Medications (Blood Thinners)**\nYou have two active prescriptions for the same medication (one generic and one brand name):\n*   **Clopidogrel 75 MG Oral Tablet** (prescribed on 2023-09-06 by Dr. Carisa395 Kutch271) [24].\n*   **Plavix 75 MG Oral Tablet (clopidogrel)** (prescribed on 2026-06-07 by MultiCare Pulse Heart Institute) [30].\n*   *Patient Meaning:* Plavix is the brand name for Clopidogrel. You are currently prescribed the same medicine twice from different sources.\n\n**3. Kidney Disease and Diabetes Staging Conflicts**\nThere are conflicting entries regarding your chronic conditions:\n*   **Kidney Disease Staging:** Your record shows three different stages of Chronic Kidney Disease (CKD) as \"active\" simultaneously: Stage 1 [11], Stage 2 [13], and Stage 3 [15]. \n*   **Diabetes Staging:** Your record lists \"Prediabetes\" as an active finding [4], even though you have a history of Type 2 Diabetes-related kidney issues [12] [14] [16].\n*   **Current Kidney Function:** Your most recent lab result from 2026-08-16 shows an **eGFR of 47.953 mL/min/{1.73_m2}** [53]. \n*   *Patient Meaning:* Clinical guidelines state you should only have one active CKD stage at a time. Based on your latest eGFR of ~48, your records should be updated to reflect the most current stage (Stage 3) and remove the older, inactive stages (Stage 1 and 2). Additionally, \"Prediabetes\" should be updated to reflect your established diabetes status.\n\nQUESTIONS_FOR_DOCTOR:\n- Can you please review my medications and confirm if I should be taking both Simvastatin [25] and Lipitor [31], or if one should be discontinued?\n- I noticed I have two prescriptions for Clopidogrel (one generic a <script>
const cls=s=>({done:'c200',err:'cerr',running:'crun',pending:'cpend'}[s]||'cpend');
const sym=s=>({done:'✓',err:'×',running:'●',pending:'·'}[s]||'·');
// Human-readable arm titles from the resolver's arm_cards (model_registry), never the raw dashed
// backend id. Filled each tick from the latest /api/status. armTitle = full; armShort = tight
// grid/column variant. Fall back to the raw id only if a card is missing.
let ARM_CARDS={};
let ARM_LABELS={};
const armTitle=b=>{const c=ARM_CARDS[b];return (c&&c.title)||ARM_LABELS[b]||b;};
const armShort=b=>{const c=ARM_CARDS[b];return (c&&(c.short_title||c.title))||ARM_LABELS[b]||b;};
const shortB=b=>armShort(b);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TONE_CLS={success:'t-ok',warning:'t-warn',danger:'t-bad',neutral:'t-neutral'};
const toneCls=t=>TONE_CLS[t]||'t-neutral';
// Latency always reads in seconds (mirrors review_presentation.format_latency).
const fmtS=ms=>ms==null||isNaN(ms)?'n/a':(Number(ms)/1000).toFixed(1)+' s';
let LAST_STATUS=null;
function fmt10(v){ return v==null ? '—' : (Math.round(v*10)/10); }
// sampler-knob display order + labels (mirrors report.py's KNOB_ORDER/KNOB_LABELS).
const KNOB_ORDER=['temp','top_p','top_k','ctx_size','seed','max_tokens','reasoning_budget','dry'];
const KNOB_LABELS={temp:'temperature',top_p:'top-p',top_k:'top-k',ctx_size:'ctx-size',seed:'seed',max_tokens:'max-tokens',reasoning_budget:'reasoning-budget',dry:'DRY'};
// "how this arm is configured" panel: sampling knobs + system prompt(s) + retrieval line.
// Mirrors report.py::renderArmConfig — fed the REAL arm_card(b).config from the resolver.
// `key` is a STABLE per-arm id (the backend_id) so OPEN_DETAILS can re-apply the open state
// across the background re-render that would otherwise collapse the panel.
function renderArmConfig(cfg,key){
 if(!cfg) return '';
 const knobs=cfg.knobs||{};
 const models=Object.keys(knobs);
 const k0=(models.length?knobs[models[0]]:{})||{};
 const tease=[];
 if(k0.temp!=null)tease.push('temp '+k0.temp);
 if(k0.seed!=null)tease.push('seed '+k0.seed);
 if(k0.dry!=null)tease.push('DRY on');
 if(k0.ctx_size!=null)tease.push('ctx '+k0.ctx_size);
 const np=(cfg.prompts||[]).length;
 if(np)tease.push(np+' system prompt'+(np>1?'s':''));
 const teaseTxt=tease.length?(' — '+tease.join(' · ')):'';
 let h="<details class=arm-config data-okey='cfg:"+esc(key)+"'><summary>how this arm is configured<span class=ac-tease>"+esc(teaseTxt)+"</span></summary><div class=ac-body>";
 if(models.length){
  const present=KNOB_ORDER.filter(k=>models.some(m=>(knobs[m]||{})[k]!=null));
  h+="<div class=ac-h>sampling knobs <span class=ac-sub>(llama-router.ini)</span></div>";
  h+="<table class=ac-knobs><thead><tr><th>knob</th>";
  models.forEach(m=>{h+="<th>"+esc(m)+"</th>";});
  h+="</tr></thead><tbody>";
  present.forEach(k=>{
   h+="<tr><td class=ac-k>"+esc(KNOB_LABELS[k]||k)+"</td>";
   models.forEach(m=>{const v=(knobs[m]||{})[k];h+="<td>"+(v==null?'—':esc(v))+"</td>";});
   h+="</tr>";
  });
  h+="</tbody></table>";
 }
 const prompts=cfg.prompts||[];
 if(prompts.length){
  h+="<div class=ac-h>system prompt"+(prompts.length>1?'s':'')+"</div>";
  prompts.forEach((p,i)=>{
   h+="<div class=ac-prompt>";
   h+="<div class=ac-plabel>"+esc(p.label)+" <span class=ac-src>"+esc(p.source)+"</span></div>";
   if(p.summary)h+="<div class=ac-psum>"+esc(p.summary)+"</div>";
   h+="<details class=ac-pfull data-okey='prompt:"+esc(key)+":"+i+"'><summary>full prompt</summary><pre class=ac-pre>"+esc(p.text)+"</pre></details>";
   h+="</div>";
  });
 }
 const r=cfg.retrieval;
 if(r){
  h+="<div class=ac-h>retrieval <span class=ac-sub>(chartsearchai GPs)</span></div>";
  h+="<div class=ac-retr>pipeline "+esc(r.pipeline)+" · embedding top-k "+esc(r.embedding_topk)+
     " · querystore top-k "+esc(r.querystore_topk)+" · threshold "+esc(r.threshold)+"</div>";
 }
 h+="</div></details>";
 return h;
}
// Per-arm card: single/team path badge + makeup (team role->model; single family·params·quant)
// + the config panel. Mirrors report.py::renderArms. Fed status().arm_cards (REUSED resolver).
function renderArmCards(d){
 const cards=d.arm_cards||{};
 const stats=d.arms||{};
 let h="<div class=arm-cards>";
 (d.backends||[]).forEach(b=>{
  const c=cards[b]||{kind:'unknown',path:'',models:[],roles:{}};
  const a=stats[b]||{};
  const team=c.kind==='team';
  const badge=team
   ?"<span class='badge team'>TEAM</span>"
   :(c.kind==='single'?"<span class='badge single'>SINGLE</span>":"<span class=badge>?</span>");
  // Headline = the resolver's human-readable title; the raw backend_id survives only as a
  // tiny muted monospace sub-label under it, never as the headline.
  const title=c.title||a.label||b;
  h+="<div class=arm-card>";
  h+="<div class=arm-head>"+badge+"<span class=arm-name>"+esc(title)+"</span></div>";
  h+="<div class=arm-id>"+esc(b)+"</div>";
  const pt=(d.profile_titles||{})[b];
  if(pt&&pt!==title)h+="<div class=arm-profile>product profile: "+esc(pt)+"</div>";
  if(c.path)h+="<div class=arm-path>"+esc(c.path)+"</div>";
  h+="<div class=arm-stats>"+(a.rows||0)+" rows · <span class='"+(a.errors?'err':'ok')+"'>"+(a.errors||0)+" err</span>"
    +" · <span class=muted>avg "+fmtS(a.avg_latency_ms||0)+" · "+(a.avg_chars||0)+"c"+(a.last?(' · '+esc(a.last)):'')+"</span></div>";
  if(team){
   // Makeup = role → readable family·params·quant; the raw dashed model id column is dropped.
   h+="<table class=makeup><tbody>";
   Object.keys(c.roles||{}).forEach(role=>{
    const m=c.roles[role]||{};
    const mq=[m.family,m.params,m.quant].filter(Boolean).join(' · ');
    h+="<tr><td class=role>"+esc(role)+"</td><td class=mq>"+esc(mq)+"</td></tr>";
   });
   h+="</tbody></table>";
  }else{
   const m=(c.models||[])[0]||{};
   const mq=[m.family,m.params,m.quant].filter(Boolean).join(' · ');
   h+="<div class=makeup-single>"+esc(mq)+"</div>";
  }
  h+=renderArmConfig(c.config,b);
  h+="</div>";
 });
 return h+"</div>";
}
function renderJudgeScores(d){
 const rows=(d.judge_combined||[]).filter(s=>(s.n_actors||0)>=1&&s.benchmark_score!=null)
  .sort((a,b)=>(b.benchmark_score||0)-(a.benchmark_score||0));
 if(!rows.length)return '<span class=muted>no judged score yet</span>';
 const judging=d.judging||{};
 const actors=(judging.recorded||(judging.cards&&judging.cards.length))?judging.sentence:'Judge not recorded for this run. Actors: '+(d.judge_actors||[]).join(', ');
 const multi=rows.some(s=>(s.n_actors||0)>1);
 const canon={};
 (d.judge||[]).forEach(s=>{if(s&&s.benchmark_score!=null)canon[s.backend]=s.benchmark_score;});
 const hasCanon=Object.keys(canon).length>0;
 let note=multi
  ?(hasCanon
    ?'Canonical score = the headline above. Combined = each cell averaged across independent judges, then averaged per arm. Range and max Δ show judge disagreement.'
    :'Combined = each cell averaged across independent judges, then averaged per arm. Range and max Δ show judge disagreement.')
  :'Score from one independent judge. Add another judge to show disagreement ranges.';
 let h='<p class=judge-note>'+esc(actors)+' '+note+'</p>';
 h+='<table class=judge-table><thead><tr><th>setup</th><th>'+(hasCanon?'canonical score':'score')+'</th>'+(multi&&hasCanon?'<th>mean across actors</th>':'')+'<th>actors</th><th>cell range</th><th>actor range</th><th>mean Δ/cell</th><th>max Δ cell</th></tr></thead><tbody>';
 rows.forEach(s=>{
  const ar=s.actor_range||{}, sp=s.benchmark_spread||{};
  const maxCell=s.max_cell_delta_scenario?(esc(s.max_cell_delta_scenario)+' · '+fmt10(s.max_cell_delta)):'—';
  const primary=hasCanon&&canon[s.backend]!=null?canon[s.backend]:s.benchmark_score;
  h+='<tr><td title="'+esc(s.backend)+'">'+esc(armTitle(s.backend))+'</td>'
   +'<td><span class=score>'+fmt10(primary)+'</span></td>'
   +(multi&&hasCanon?'<td>'+fmt10(s.benchmark_score)+'</td>':'')
   +'<td>'+(s.n_actors||0)+'</td>'
   +'<td>'+(sp.min==null?'—':fmt10(sp.min)+'–'+fmt10(sp.max))+'</td>'
   +'<td>'+(ar.min==null?'—':fmt10(ar.min)+'–'+fmt10(ar.max))+'</td>'
   +'<td>'+fmt10(s.mean_abs_delta)+'</td><td>'+maxCell+'</td></tr>';
 });
 const c=judging.consensus||{};
 if(c.alpha){
  const th=c.thresholds||{acceptable:0.667,good:0.8};
  h+='<p class=judge-note>Agreement between the '+(c.actors||[]).length+' passes (Krippendorff’s alpha; '+th.acceptable+' acceptable, '+th.good+' good): '
   +Object.keys(c.alpha).map(k=>esc(k)+' '+(c.alpha[k].alpha==null?'—':c.alpha[k].alpha.toFixed(3))+' ('+esc(c.alpha[k].verdict)+')').join(' · ')+'</p>';
  const sp=(c.spread_cells||[]).slice(0,5);
  if(sp.length) h+='<p class=judge-note>Widest cells: '+sp.map(s=>esc(s.scenario_id)+' × '+esc(armTitle(s.backend_id))+' range '+fmt10(s.range)).join(' · ')+'</p>';
  const j=c.judges||{};
  if(j.per_judge){
   const jt=j.thresholds||{acceptable:0.667,good:0.8};
   h+='<p class=judge-note>Judges side by side (Benchmark per setup): '+Object.keys(j.per_judge).map(id=>esc(id)+' ['+(j.per_judge[id].scout||[]).map(s=>esc(armTitle(s.backend))+' '+fmt10(s.benchmark_score)).join(', ')+']').join(' · ')
    +'. Agreement between judges (alpha; '+jt.acceptable+' acceptable, '+jt.good+' good): '+Object.keys(j.alpha||{}).map(k=>esc(k)+' '+(j.alpha[k].alpha==null?'—':j.alpha[k].alpha.toFixed(3))).join(' · ')+'</p>';
  }
 }
 return h+'</tbody></table>';
}
// The background poll re-renders #arms wholesale; that wipes the user's expanded <details>.
// Track which panels are open by their STABLE data-okey (arm backend_id, NOT a DOM index),
// updated on every toggle, and re-apply after each re-render so an open config / full-prompt
// panel survives auto-refresh. Parallel: the data refresh no longer clobbers UI state.
const OPEN_DETAILS=new Set();
document.addEventListener('toggle',e=>{
 const d=e.target;
 if(!d||d.tagName!=='DETAILS')return;
 const k=d.getAttribute&&d.getAttribute('data-okey');
 if(!k)return;
 if(d.open)OPEN_DETAILS.add(k);else OPEN_DETAILS.delete(k);
},true);
function restoreOpenDetails(root){
 (root||document).querySelectorAll('details[data-okey]').forEach(d=>{
  d.open=OPEN_DETAILS.has(d.getAttribute('data-okey'));
 });
}
async function tick(){
 let d; try{d=await(await fetch('/api/status')).json()}catch(e){return}
 // A catalyst run has no judge or arm-card machinery; empty boxes are noise.
 const isCat=d.family==='catalyst';
 document.querySelectorAll('section').forEach(s=>{
  const h=s.querySelector('h2'); if(!h) return;
  if(/^(Arms|Judged scores)/.test(h.textContent)) s.style.display=isCat?'none':'';
 });
 if(!d.run){hdr.textContent='waiting for a run...';return}
 ARM_CARDS=d.arm_cards||{};
 LAST_STATUS=d;
 ARM_LABELS={};Object.keys(d.arms||{}).forEach(b=>{ARM_LABELS[b]=(d.arms[b]||{}).label;});
 const pct=d.total?Math.round(100*d.done/d.total):0;
 hdr.textContent='run '+d.run.slice(0,8)+'  ·  set '+(d.set||'')+'  ·  '+pct+'%';
 fill.style.width=pct+'%'; prog.textContent=d.done+' / '+d.total+' results';
 const wb=document.getElementById('warnbar');
 if(wb){ if(d.warning){wb.textContent=d.warning; wb.style.display='';} else wb.style.display='none'; }
 const lg=document.getElementById('legend');
 if(lg){
  if(isCat){
   let t='<b>'+(d.conformant||0)+'</b> followed an allowed path &nbsp;·&nbsp; <b>'+(d.unexpected||0)+'</b> unexpected behaviour';
   if(d.judged_scored) t+=' &nbsp;·&nbsp; judged <b>'+(d.judged_passed||0)+'/'+d.judged_scored+'</b> — see the report';
   lg.innerHTML=t+'<br><span class=c200 style="padding:0 4px">✓</span> allowed path (a refusal, a question or a wrong answer still counts) &nbsp;·&nbsp; <span class=cerr style="padding:0 4px">×</span> the system misbehaved &nbsp;·&nbsp; <span class=crun style="padding:0 4px">●</span> running';
  } else {
   const L=(d.status_legend||[]).map(x=>'<span class="gpill '+toneCls(x.tone)+'">'+esc(x.symbol)+'</span> '+esc(x.label)).join(' &nbsp;');
   lg.innerHTML='Each cell: <span class="gpill t-neutral">A</span> the Answer and <span class="gpill t-neutral">ID</span> the In-Depth, worst across the cell\'s turns; a number counts marked In-Depth points. '+L
    +'<br>Corner mark: <span class=gconf>\u2713</span> the run followed an allowed path &nbsp;·&nbsp; <span class="gconf err">\u00d7</span> the system misbehaved (hover a cell for words).';
  }
 }
 models.innerHTML=(d.models||[]).map(m=>'<span class=chip title="'+esc(m.kind||'')+'">'+(m.kind?'<span class=muted>'+esc(m.kind)+'</span> ':'')+esc(m.id||m)+'</span>').join('')||'<span class=muted>no models recorded</span>';
 arms.innerHTML=renderArmCards(d);
 restoreOpenDetails(arms);   // re-apply the user's expanded config/full-prompt panels after the re-render
 judges.innerHTML=renderJudgeScores(d);
 renderCheckPrecision(d);
