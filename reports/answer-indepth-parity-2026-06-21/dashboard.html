-parity-2026-06-21", "title": "Does an AI team's deeper explanation beat a single model's?", "summary": "The new two-call architecture: every setup returns a fast Answer and a separate, slower In-Depth, each independently timed and graded — for single models AND the multi-agent team, on equal footing, via the same shared in-depth prompt. Three patients, 32 clinical questions, five setups (Google Gemma 12B, Alibaba Qwen 14B, Google MedGemma 27B, Liquid LFM2 24B singles, plus a parity AI team).", "takeaway": "Holding the in-depth prompt fixed, the team's elaboration does NOT beat a single model's. The single Gemma 12B topped BOTH axes — best Answer (73) AND best In-Depth (added-value 6.9, zero unsafe elaborations) — while the parity team's in-depth was no better (6.2), and the fast on-device Liquid 24B's in-depth was actively dangerous (10 unsafe elaborations). Separate latencies confirm the design: a quick answer (Gemma ~20s, Liquid ~2s) followed by a slower in-depth (~12-24s). One strong general model gives the best answer AND the best background; the team scaffolding adds neither. Directional results from a single automated judge on a small sample, not a formal benchmark.", "family": "chartsearchai", "featured": true, "catalog_order": 26, "arms": {"12b-2call": "Google Gemma 4 12B (single model)", "parity-team-2call": "Multi-agent parity team (Gemma + Qwen)", "qwen2.5-14b-2call": "Alibaba Qwen 2.5 14B (single model)", "medgemma-27b-2call": "Google MedGemma 27B (single model)", "lfm2-24b-2call": "Liquid LFM2 24B (on-device single model)"}, "date": "21 Jun 2026"}</script><script type='application/json' id='dashboard-data' data-src='./dashboard-data.json'></script><script src='../assets/dashboard-shell.js?v=e146301b72'></script></body></html>
