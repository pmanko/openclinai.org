# llama.cpp Router Mode model presets — one OpenAI endpoint, on-demand boot, auto-download via hf-repo.
# Launch:  scripts/llama-router-up.sh   (redirects HF_HOME to an empty dir so the router does NOT
#          auto-publish cached HF models as extra/untuned presets — build 9430 has no flag for that).
# Model paths resolve through artifacts/llama-router/models, a runtime symlink
# created by llama-router-up.sh from LLAMA_MODEL_DIR (default:
# ~/.cache/llama-router-models). File paths are relative to the project root.
#
# Global serving defaults = temp 0 (greedy) + the hub baseline DRY params, single KV slot. We deliberately
# do NOT set `samplers`: build 9430's default chain already includes dry
# (penalties;dry;top_n_sigma;top_k;typ_p;top_p;min_p;xtc;temperature), and an INI value cannot carry the
# ';' separator — it is parsed as an inline comment, which silently truncates `dry;temperature` to `dry`
# (and drops top_k/top_p/temperature for the thinking synth). So we set the dry-* params + temp/top-k/top-p
# and let the default chain apply them. At temp 0 the extra default samplers are no-ops (greedy = argmax),
# so this matches the hub's deterministic baseline. The thinking synth (qwen3.6) overrides temp/top-p/top-k
# for sampling (Qwen3 forbids greedy). reasoning-budget 0 for non-thinking, a bounded budget for the thinking synth (see [qwen3.6-35b]).
# `seed` is pinned for reproducibility.
#
# EASY PER-MODEL OVERRIDE: [*] below is the shared default. To change any setting for ONE
# model, just add that key under its [section] — it overrides [*] for that model only
# (temp, top-p/top-k/min-p, dry-multiplier/dry-base/dry-allowed-length, max-tokens,
# ctx-size, ngl, reasoning-budget, seed, …). See [qwen3.6-35b] for a worked example.

[*]
ngl = 99
ctx-size = 24576
parallel = 1
# Match ChartSearchAI and the Catalyst CPU router's prompt-processing batches.
batch-size = 4096
ubatch-size = 1024
temp = 0
seed = 42
# DRY off (28 October 2026): with it on, the writer garbled dates it copied from the chart
# (2026-01_26) and scored the same without it; the base and allowed length stay for a
# section that turns it back on.
dry-multiplier = 0
dry-base = 1.75
dry-allowed-length = 8
# -1 meant "scan the whole context" up to llama.cpp build 9430; build 10809+ rejects it
# outright ("invalid dry-penalty-last-n = -1"), and the router reports only a bare
# `instance exited with status 1`. 24576 is the [*] ctx-size, i.e. exactly what -1 meant.
dry-penalty-last-n = 24576
reasoning-budget = 0

# --- Single-LLM parity arms + team orchestrator (downloaded GGUFs in LLAMA_MODEL_DIR) ---
[gemma-26b]
model = artifacts/llama-router/models/gemma-26b-a4b.gguf

[gemma-e4b]
model = artifacts/llama-router/models/gemma-e4b.gguf
# The complete OpenELIS reporting schema exceeds the shared 24k context.
# Keep every readable relation and room for refinement within this model's 128k limit.
ctx-size = 98304

[qwen2.5-14b]
model = artifacts/llama-router/models/qwen2.5-14b.gguf

# --- Cross-family checkers (reviewer and grounder), thinking off. Qwen3.6-35B-A3B
# UD-Q4_K_M and Qwen3.5-9B Q8_0, pinned in scripts/llama-router.models.tsv.
# Non-thinking sampling from the model cards (temp 0.7, top-p 0.8, top-k 20, min-p 0,
# presence penalty 1.5, no DRY); a profile's knobs may still set the temperature per role. ---
[qwen3.6-35b]
model = artifacts/llama-router/models/qwen3.6-35b.gguf
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
presence-penalty = 1.5
dry-multiplier = 0
# reasoning-budget 0 still lets the Qwen3 templates think; reasoning off disables it.
reasoning = off

[qwen3.5-9b]
model = artifacts/llama-router/models/qwen3.5-9b.gguf
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
presence-penalty = 1.5
dry-multiplier = 0
# reasoning-budget 0 still lets the Qwen3 templates think; reasoning off disables it.
reasoning = off

# --- Priority-run model set (downloaded GGUFs symlinked into ~/.cache/llama-router-models) ---
[gemma-e2b]
model = artifacts/llama-router/models/gemma-e2b.gguf

[gemma-e4b-q8]
model = artifacts/llama-router/models/gemma-e4b-q8.gguf

# gemma-4-12B-it Q8 — strong dense orchestrator candidate + standalone arm.
[gemma-4-12b]
model = artifacts/llama-router/models/gemma-4-12b.gguf
# Gemma 4 uses sliding-window attention; without a full-size SWA cache the router
# cannot reuse a shared prompt start (llama.cpp #13194), and every Hub stage re-reads it.
swa-full = true

[medgemma-1.5-4b-q8]
model = artifacts/llama-router/models/medgemma-1.5-4b-q8.gguf

[gemma-31b]
model = artifacts/llama-router/models/gemma-31b.gguf
# Same sliding-window attention as the 12B: keep the full SWA cache so stages reuse the prompt start.
swa-full = true

[gemma-4-12b-q4]
# Quant control: Gemma-12B at Q4 vs the Q8 (gemma-4-12b) — isolates the precision confound.
model = artifacts/llama-router/models/gemma-4-12b-q4.gguf
