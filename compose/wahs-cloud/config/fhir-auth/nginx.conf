server {
  listen 8080;
  client_max_body_size 25m;

  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'HEAD, GET, OPTIONS, PATCH, POST, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, Content-Type, Accept, Cache-Control' always;
      add_header 'Access-Control-Max-Age' 1728000 always;
      add_header 'Content-Type' 'text/plain; charset=utf-8' always;
      add_header 'Content-Length' 0 always;
      return 204;
    }

    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'HEAD, GET, OPTIONS, PATCH, POST, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, Content-Type, Accept, Cache-Control' always;

    proxy_pass http://fhir-auth-proxy:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cache-Control "no-cache";
    proxy_pass_request_headers on;
    proxy_read_timeout 120s;
    proxy_connect_timeout 30s;
  }
}
