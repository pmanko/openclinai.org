services:
  wahs-db:
    image: postgres:14.4
    container_name: wahs-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wahs-cloud-db-data:/var/lib/postgresql/data
      - ./config/db:/docker-entrypoint-initdb.d:ro
    networks:
      wahs-net:
        aliases:
          - db
          - wahs-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  wahs-keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: wahs-cloud-keycloak
    restart: unless-stopped
    command:
      - "-Dkeycloak.migration.action=import"
      - "-Dkeycloak.migration.provider=dir"
      - "-Dkeycloak.migration.dir=/opt/keycloak/data/import"
      - "-Dkeycloak.migration.strategy=IGNORE_EXISTING"
      - "-Dkeycloak.migration.replace-placeholders=true"
      - "start"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: wahs-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://wahs-web.openclinai.org
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_SHL_CREATOR_BASE: https://wahs-web.openclinai.org
      KEYCLOAK_SHL_CREATOR_LOGOUT_REDIRECT_URL: https://wahs-web.openclinai.org
      KEYCLOAK_GOOGLE_IDP_ENABLED: "false"
      KEYCLOAK_GOOGLE_IDP_CLIENT_ID: ""
      KEYCLOAK_GOOGLE_IDP_CLIENT_SECRET: ""
      KEYCLOAK_WAHS_LOGS_CLIENT_SECRET: ${KEYCLOAK_WAHS_LOGS_CLIENT_SECRET:-wahs-cloud-logs-secret}
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./config/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      wahs-net:
        aliases:
          - keycloak
          - wahs-keycloak
      openclinai-edge:
        aliases:
          - wahs-keycloak
    depends_on:
      wahs-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/wahs HTTP/1.0\\r\\nHost: localhost:8080\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  wahs-fhir:
    image: hapiproject/hapi:v8.0.0
    container_name: wahs-cloud-fhir
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=512m"
      spring.datasource.url: jdbc:postgresql://wahs-db:5432/hapifhir
      spring.datasource.username: postgres
      spring.datasource.password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.client_id_strategy: ANY
      hapi.fhir.allow_cascading_deletes: "true"
      hapi.fhir.enforce_referential_integrity_on_write: "false"
      hapi.fhir.use_apache_address_strategy: "true"
      hapi.fhir.use_apache_address_strategy_https: "false"
      hapi.fhir.ips_enabled: "true"
      hapi.fhir.cr.enabled: "true"
      management.endpoints.web.exposure.include: "*"
    volumes:
      - ./config/hapi/HealthCheck.java:/opt/health/HealthCheck.java:ro
    networks:
      wahs-net:
        aliases:
          - fhir-internal
          - wahs-fhir
    depends_on:
      wahs-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "/opt/health/HealthCheck.java"]
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 90s

  wahs-fhir-auth-proxy:
    image: ghcr.io/uwcirg/jwt-proxy:latest
    container_name: wahs-cloud-fhir-auth-proxy
    restart: unless-stopped
    environment:
      PORT: "8008"
      UPSTREAM_SERVER: http://fhir-internal:8080
      OIDC_AUTHORIZE_URL: https://wahs-web.openclinai.org/realms/wahs/protocol/openid-connect/auth
      OIDC_TOKEN_URI: https://wahs-web.openclinai.org/realms/wahs/protocol/openid-connect/token
      OIDC_TOKEN_INTROSPECTION_URI: http://keycloak:8080/realms/wahs/protocol/openid-connect/token/introspect
      JWKS_URL: http://keycloak:8080/realms/wahs/protocol/openid-connect/certs
      PATH_WHITELIST: /fhir/metadata,/fhir/.well-known/smart-configuration
      POLICIES_DIR: /opt/app/jwt_proxy/policies
      PASSTHRU_AUTH_HEADERS: "true"
    volumes:
      - ./config/jwt-proxy/api.py:/opt/app/jwt_proxy/api.py:ro
    networks:
      wahs-net:
        aliases:
          - fhir-auth-proxy
    depends_on:
      wahs-fhir:
        condition: service_healthy
      wahs-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/fhir/.well-known/smart-configuration', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  wahs-fhir-auth:
    image: nginx:1.27-alpine
    container_name: wahs-cloud-fhir-auth
    restart: unless-stopped
    volumes:
      - ./config/fhir-auth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      wahs-net:
        aliases:
          - fhir-auth
          - wahs-fhir-auth
      openclinai-edge:
        aliases:
          - wahs-fhir-auth
    depends_on:
      wahs-fhir-auth-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/fhir/.well-known/smart-configuration"]
      interval: 10s
      timeout: 5s
      retries: 10

  wahs-shl-server:
    image: ghcr.io/uwcirg/smart.health.links-server:latest
    platform: linux/amd64
    container_name: wahs-cloud-shl-server
    restart: unless-stopped
    environment:
      PORT: "8000"
      PUBLIC_URL: https://wahs-web.openclinai.org/shl-server
      JWKS_URL: http://keycloak:8080/realms/wahs/protocol/openid-connect/certs
      JWT_ISSUER: https://wahs-web.openclinai.org/realms/wahs
      PASSCODE_ENCRYPTION_KEY: ${SHL_PASSCODE_ENCRYPTION_KEY:?SHL_PASSCODE_ENCRYPTION_KEY is required}
    volumes:
      - wahs-cloud-shl-data:/app/db
    networks:
      wahs-net:
        aliases:
          - shl-server
          - wahs-shl-server
      openclinai-edge:
        aliases:
          - wahs-shl-server
    depends_on:
      wahs-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8000/'); Deno.exit(r.ok ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  wahs-engine:
    build:
      context: ./src/wahs-engine
    image: wahs-cloud-engine:dev
    container_name: wahs-cloud-engine
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      WAHS_FHIR_AUTH_BASE_URL: http://fhir-auth:8080/fhir
      WAHS_ALLOW_LOCAL_BUNDLE_MODE: "false"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.co.dev.cirg.uw.edu/v1}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      WAHS_DEFAULT_MODEL: ${WAHS_DEFAULT_MODEL:-wahs-26b-kb}
      WAHS_PROVIDER_FLAVOR: ${WAHS_PROVIDER_FLAVOR:-litellm}
      WAHS_LLM_TIMEOUT_SECONDS: ${WAHS_LLM_TIMEOUT_SECONDS:-180}
      WAHS_MODEL_MAP_JSON: ${WAHS_MODEL_MAP_JSON:-{"wahs-26b-kb":"ollama/gemma4:26b","wahs-26b-raw":"ollama/gemma4:26b","wahs-12b-kb":"ollama/gemma4:12b","wahs-12b-raw":"ollama/gemma4:12b","wahs-e4b-kb":"ollama/gemma4:e4b","wahs-e4b-raw":"ollama/gemma4:e4b","wahs-qwen3-14b-kb":"ollama/qwen3:14b","wahs-qwen3-8b-kb":"ollama/qwen3:8b","wahs-llama31-8b-kb":"ollama/llama3.1:8b","gemma-4-e4b":"ollama/gemma4:e4b","gemma4:26b":"ollama/gemma4:26b","gemma4:12b":"ollama/gemma4:12b","gemma4:e4b":"ollama/gemma4:e4b","qwen3-14b":"ollama/qwen3:14b","qwen3.5-9b":"ollama/qwen3:8b","llama-3.1-8b":"ollama/llama3.1:8b"}}
      WAHS_CONTEXT_WINDOW: ${WAHS_CONTEXT_WINDOW:-32768}
      WAHS_CHART_BUDGET_CEILING: ${WAHS_CHART_BUDGET_CEILING:-16384}
      WAHS_CACHE_TTL_SECONDS: ${WAHS_CACHE_TTL_SECONDS:-1800}
      WAHS_MAX_OVERLAY_BYTES: "5120"
    networks:
      wahs-net:
        aliases:
          - wahs-engine
    depends_on:
      wahs-fhir-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  wahs-seeder:
    image: wahs-cloud-engine:dev
    pull_policy: never
    profiles: ["seed"]
    volumes:
      - ./bundles:/bundles:ro
    command:
      - python
      - -m
      - wahs_engine.seeder
      - --fhir-url
      - http://fhir-internal:8080/fhir
      - --persona
      - all
      - --bundles-dir
      - /bundles
      - --keycloak-url
      - http://keycloak:8080
      - --keycloak-realm
      - wahs
      - --keycloak-admin
      - admin
      - --keycloak-admin-password
      - ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    networks:
      - wahs-net
    depends_on:
      wahs-fhir:
        condition: service_healthy
      wahs-keycloak:
        condition: service_healthy

  wahs-shl-ips:
    build:
      context: ./src/shl-ips
      target: prod
      args:
        VITE_INSTANCE_ID: WAHealthSummary
        VITE_APP_VERSION_STRING: wahs-cloud
    image: wahs-cloud-shl-ips:dev
    container_name: wahs-cloud-shl-ips
    restart: unless-stopped
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      ORIGIN: https://wahs-web.openclinai.org
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      VITE_LOCAL_DEMO: "false"
      SERVER_LOCAL_DEMO_MODE: "false"
      VITE_INSTANCE_ID: WAHealthSummary
      VITE_APP_VERSION_STRING: wahs-cloud
      VITE_API_BASE: https://wahs-web.openclinai.org/shl-server/api
      SERVER_API_BASE: http://shl-server:8000/api
      VITE_INTERMEDIATE_FHIR_SERVER_BASE: https://wahs-web.openclinai.org/fhir
      VITE_AUTH_URL: https://wahs-web.openclinai.org/realms/wahs
      VITE_AUTH_CLIENT_ID: shl_creator
      VITE_AUTH_REDIRECT_URI: https://wahs-web.openclinai.org/auth
      VITE_AUTH_SILENT_REDIRECT_URI: https://wahs-web.openclinai.org/silent_redirect_callback.html
      VITE_AUTH_POST_LOGOUT_URI: https://wahs-web.openclinai.org
      VITE_VIEWER_BASE: https://wahs-web.openclinai.org/ips#
      VITE_SYSTEM_URL: https://wahs-web.openclinai.org
      WAHS_ENGINE_URL: http://wahs-engine:8080/v1
      WAHS_DEFAULT_MODEL: ${WAHS_DEFAULT_MODEL:-wahs-26b-kb}
      SHC_PRIVATE_JWK: ""
      SHC_PUBLIC_JWK_STORE: '{"keys":[]}'
    networks:
      wahs-net:
        aliases:
          - wahs-shl-ips
      openclinai-edge:
        aliases:
          - wahs-shl-ips
    depends_on:
      wahs-engine:
        condition: service_healthy
      wahs-shl-server:
        condition: service_healthy
      wahs-fhir-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  wahs-mobile-frontend:
    build:
      context: ./src/wahs-mobile-frontend
    image: wahs-cloud-mobile:dev
    container_name: wahs-cloud-mobile-frontend
    restart: unless-stopped
    environment:
      PORT: "4001"
      HOST: 0.0.0.0
      LOCAL_DEMO_MODE: "false"
      WAHS_ENGINE_URL: http://wahs-engine:8080/v1
      WAHS_DEFAULT_MODEL: ${WAHS_DEFAULT_MODEL:-wahs-26b-kb}
      FHIR_AUTH_BASE_URL: https://wahs-mobile.openclinai.org/fhir
      SHL_SERVER_API_BASE: https://wahs-mobile.openclinai.org/shl-server/api
      SHL_VIEWER_BASE_URL: https://wahs-web.openclinai.org/ips#
      KEYCLOAK_AUTH_URL: https://wahs-web.openclinai.org/realms/wahs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/wahs
      KEYCLOAK_CLIENT_ID: shl_creator
    networks:
      wahs-net:
        aliases:
          - wahs-mobile-frontend
      openclinai-edge:
        aliases:
          - wahs-mobile-frontend
    depends_on:
      wahs-engine:
        condition: service_healthy
      wahs-shl-server:
        condition: service_healthy
      wahs-fhir-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  wahs-auth-gate:
    build:
      context: ../../wahs/cloud-gate
    image: wahs-cloud-auth-gate:dev
    container_name: wahs-cloud-auth-gate
    restart: unless-stopped
    environment:
      PORT: "8096"
      WAHS_GATE_COOKIE_SECRET: ${WAHS_GATE_COOKIE_SECRET:?WAHS_GATE_COOKIE_SECRET is required}
      WAHS_AUTH_WHITELIST_EMAILS: ${WAHS_AUTH_WHITELIST_EMAILS:-piotr.mankowski@gmail.com,pmanko@uw.edu,ivanc@uw.edu,mcjustin@uw.edu,jflow2@uw.edu,lober@uw.edu,ibacher@uw.edu}
      WAHS_GATE_COOKIE_DOMAIN: .openclinai.org
      WAHS_GATE_COOKIE_SECURE: "true"
    networks:
      wahs-net:
        aliases:
          - wahs-auth-gate
      openclinai-edge:
        aliases:
          - wahs-auth-gate
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  wahs-cloud-db-data:
  wahs-cloud-shl-data:

networks:
  wahs-net:
    driver: bridge
  openclinai-edge:
    external: true
    name: openclinai-edge
