services:
  # Retained website host; no dependency on a product environment.
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
      CADDY_SITE_REPORTS: ${CADDY_SITE_REPORTS:-:8091}
      CADDY_SITE_WAHS: ${CADDY_SITE_WAHS:-:8092}
      CADDY_EMAIL: ${CADDY_EMAIL:-nobody@example.com}
    ports:
      - "${WEBSITE_HTTP_PORT:-8088}:80"
      - "${WEBSITE_HTTPS_PORT:-8443}:443"
      - "${WEBSITE_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../landing:/srv/landing:ro
      - ../../artifacts/reports:/srv/reports:ro
      - caddy_data:/data
      - caddy_config:/config


volumes:
  caddy_data:
  caddy_config:
